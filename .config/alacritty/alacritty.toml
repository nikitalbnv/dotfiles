general.import = [ "~/.local/state/omarchy/current/theme/alacritty.toml" ]


[font]
normal = { family = "MesloLGS Nerd Font" }
bold = { family = "MesloLGS Nerd Font" }
italic = { family = "MesloLGS Nerd Font" }
size = 9

[window]
padding.x = 0
padding.y = 0
decorations = "None"

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" },
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
  # Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
  # Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
#save_to_clipboard
 { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control", action = "Paste" },

  # Ctrl+Backspace delete previous word  sends Ctrl+W
  { key = "Back", mods = "Control", chars = "\u0017" },

  # Ctrl+Delete delete next word  sends Esc d
  { key = "Delete", mods = "Control", chars = "\u001bd" },
]


[terminal]
osc52 = "CopyPaste"
